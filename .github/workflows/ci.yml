name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mais
          POSTGRES_PASSWORD: mais
          POSTGRES_DB: mais_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mais -d mais_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://mais:mais@localhost:5432/mais_ci?schema=public
      AUTH_SECRET: ci-secret-only-for-tests-0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Integração: fila de mensagens (concorrência entre workers, janela, limite diário)
      - name: Testes de integração
        env:
          TEST_DATABASE_URL: postgresql://mais:mais@localhost:5432/mais_ci_integration?schema=public
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma db push --skip-generate --schema packages/db/prisma/schema
          npm run test:integration -w @mais/messaging
      - run: npm run build -w @mais/web
